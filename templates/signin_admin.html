<!DOCTYPE html>

<html>

<head>

<title>

Admin Login

</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>

body{

background-image:url("/static/images/home_bg.jpg");

background-size:cover;

background-position:center;

height:100vh;

margin:0;

}

.overlay{

background:rgba(0,0,0,0.55);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.card{

width:600px;

padding:40px;

background:rgba(255,255,255,0.15);

backdrop-filter:blur(12px);

border-radius:20px;

box-shadow:0px 0px 30px black;

}

h2{

text-align:center;

color:white;

margin-bottom:30px;

}

.form-control{

height:50px;

margin-bottom:20px;

border-radius:12px;

}

.btn{

width:100%;

height:50px;

background:#D32F2F;

border:none;

border-radius:30px;

color:white;

font-size:18px;

font-weight:bold;

}

</style>

</head>

<body>

<div class="overlay">

<div class="card">

<h2>

Admin Login

</h2>

<form action="/admin_login"

method="POST">

<input

type="text"

name="username"

placeholder="Admin Username"

class="form-control"

required>

<input

type="password"

name="password"

placeholder="Password"

class="form-control"

required>

<button class="btn">

Login

</button>

</form>

</div>

</div>

</body>

</html>
