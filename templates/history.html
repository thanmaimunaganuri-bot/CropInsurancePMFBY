<!DOCTYPE html>
<html>

<head>

<title>Prediction History</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>

body{

background:#0F172A;

font-family:Arial;

padding:40px;

}

.container-box{

background:white;

padding:30px;

border-radius:20px;

}

h2{

text-align:center;

margin-bottom:30px;

font-weight:bold;

color:#14532D;

}

table{

text-align:center;

vertical-align:middle;

}

img{

width:90px;

height:90px;

object-fit:cover;

border-radius:10px;

}

.btn-back{

margin-top:25px;

background:#2E7D32;

color:white;

border:none;

padding:12px 30px;

border-radius:30px;

font-weight:bold;

}

.btn-back:hover{

background:#1B5E20;

}

</style>

</head>

<body>

<div class="container">

<div class="container-box">

<h2>🌱 Prediction History</h2>

<table class="table table-bordered table-striped">

<thead class="table-success">

<tr>

<th>Farmer</th>

<th>District</th>

<th>Uploaded Image</th>

<th>Disease</th>

<th>Confidence (%)</th>

<th>Affected Area (%)</th>

<th>Severity</th>

<th>Date & Time</th>

</tr>

</thead>

<tbody>

{% for row in data %}
<tr>

<td>{{ row[0] }}</td>

<td>{{ row[1] }}</td>

<td>
    <img src="/uploads/{{ row[2] }}">
</td>

<td>{{ row[4] }}</td>

<td>{{ "%.2f"|format(row[5]) }}</td>

<td>{{ row[6] }}</td>

<td>{{ row[7] }}</td>

<td>{{ row[8] }}</td>

</tr>

{% endfor %}

</tbody>

</table>

<center>

<a href="/admin_dashboard">

<button class="btn-back">

← Back to Dashboard

</button>

</a>

</center>

</div>

</div>

</body>

</html>
