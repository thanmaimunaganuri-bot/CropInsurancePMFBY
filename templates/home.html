<!DOCTYPE html>

<html>

<head>

<title>

AI Based Real-Time Crop Image Analytics

</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>

body{

margin:0;

padding:0;

background-image:url("/static/images/home_bg.jpg");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

height:100vh;

font-family:Arial, Helvetica, sans-serif;

overflow:hidden;

}

.overlay{

background:rgba(0,0,0,0.55);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.card{

background:rgba(255,255,255,0.15);

backdrop-filter:blur(15px);

padding:50px;

width:900px;

border-radius:25px;

text-align:center;

box-shadow:0px 8px 35px rgba(0,0,0,0.4);

border:1px solid rgba(255,255,255,0.3);

}

h1{

color:white;

font-size:48px;

font-weight:700;

text-shadow:2px 2px 10px rgba(0,0,0,0.4);

}

h3{

color:#f5f5f5;

margin-top:15px;

margin-bottom:35px;

font-size:28px;

}

.btn{

width:220px;

padding:14px;

font-size:18px;

border-radius:40px;

margin:10px;

transition:0.3s;

font-weight:bold;

border:none;

}

.btn:hover{

transform:translateY(-4px);

box-shadow:0px 5px 15px rgba(0,0,0,0.35);

}

.signup{

background:#2E7D32;

color:white;

}

.signin{

background:#1976D2;

color:white;

}

.admin{

background:#D32F2F;

color:white;

}

.signup:hover{

background:#1B5E20;

}

.signin:hover{

background:#1565C0;

}

.admin:hover{

background:#B71C1C;

}

</style>

</head>

<body>

<div class="overlay">

<div class="card">

<h1>

AI Based Real-Time Crop Image Analytics

</h1>

<h3>

Crop Insurance under PMFBY

</h3>

<a href="/signup">

<button

class="btn signup">

Signup User

</button>

</a>

<a href="/signin_user">

<button

class="btn signin">

Signin User

</button>

</a>

<a href="/signin_admin">

<button

class="btn admin">

Signin Admin

</button>

</a>

</div>

</div>

</body>

</html>
