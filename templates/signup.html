<!DOCTYPE html>

<html>

<head>

<title>

Signup

</title>

<link rel="stylesheet"

href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>

body{

margin:0;

padding:0;

background-image:url("/static/images/home_bg.jpg");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

height:100vh;

font-family:Arial;

}

.overlay{

background:rgba(0,0,0,0.55);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.card{

width:850px;

padding:40px;

border-radius:20px;

background:rgba(255,255,255,0.15);

backdrop-filter:blur(12px);

box-shadow:0px 0px 30px black;

}

h2{

text-align:center;

color:white;

font-weight:bold;

margin-bottom:30px;

}

.form-control{

height:50px;

border-radius:12px;

margin-bottom:20px;

}

.btn{

width:100%;

height:50px;

border-radius:25px;

font-size:18px;

font-weight:bold;

background:#28a745;

color:white;

border:none;

}

.btn:hover{

background:#1B5E20;

}

a{

color:white;

text-decoration:none;

font-weight:bold;

}

a:hover{

color:#00ff88;

}

</style>

</head>

<body>

<div class="overlay">

<div class="card">

<h2>

Registration Form

</h2>

<form action="/save_user"

method="POST">

<input

type="text"

name="name"

placeholder="Name"

class="form-control"

required>


<input

type="text"

name="username"

placeholder="Username"

class="form-control"

required>


<input

type="email"

name="email"

placeholder="abc@gmail.com"

class="form-control"

required>


<input

type="text"

name="phone"

placeholder="+91 XXXXXXXXXX"

class="form-control"

required>


<input

type="password"

name="password"

placeholder="Password"

class="form-control"

required>


<input

type="password"

name="confirm"

placeholder="Confirm Password"

class="form-control"

required>


<button

class="btn">

Register

</button>

</form>

<br>

<center>

<a href="/signin_user">

Already have an Account ?

Sign In

</a>

</center>

</div>

</div>

</body>

</html>
