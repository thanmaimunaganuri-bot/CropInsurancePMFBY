<!DOCTYPE html>

<html>

<head>

<title>

User Dashboard

</title>

<link rel="stylesheet"

href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>

body{

margin:0;

padding:0;

height:100vh;

background-image:url("/static/images/dashboard_bg.jpg");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

font-family:Arial,Helvetica,sans-serif;

}

.overlay{

background:rgba(0,0,0,0.55);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.card-box{

width:900px;

padding:40px;

border-radius:30px;

background:rgba(255,255,255,0.12);

backdrop-filter:blur(15px);

box-shadow:0px 0px 30px rgba(0,0,0,0.5);

}

h1{

color:white;

text-align:center;

font-size:40px;

font-weight:bold;

margin-bottom:10px;

}

.subtitle{

color:white;

text-align:center;

margin-bottom:30px;

font-size:18px;

}

.form-control{

height:55px;

border-radius:15px;

font-size:17px;

}

.preview{

text-align:center;

margin-top:20px;

}

.preview img{

width:250px;

height:250px;

object-fit:cover;

border-radius:20px;

display:none;

box-shadow:0px 0px 20px black;

}

.btn-analyze{

width:100%;

height:55px;

border:none;

border-radius:15px;

background:#28a745;

color:white;

font-size:20px;

font-weight:bold;

transition:0.3s;

}

.btn-analyze:hover{

background:#1B5E20;

transform:scale(1.02);

}

</style>

</head>

<body>

<div class="overlay">

<div class="card-box">

<h1>

🌱 Crop Disease Detection

</h1>

<p class="subtitle">

Upload Crop Leaf Image for AI Analysis

</p>

<form

action="/predict"

method="POST"

enctype="multipart/form-data">

<input

type="text"

name="farmer"

placeholder="👨‍🌾 Farmer Name"

class="form-control mb-3"

required>


<input

type="text"

name="district"

placeholder="📍 District"

class="form-control mb-3"

required>


<input

type="file"

name="image"

id="imageInput"

accept="image/*"

class="form-control mb-3"

required>


<div class="preview">

<img id="preview">

</div>


<button

class="btn-analyze">

🚜 Analyze Crop

</button>

</form>

</div>

</div>

<script>

const input=document.getElementById("imageInput");

const preview=document.getElementById("preview");

input.onchange=function(){

preview.src=URL.createObjectURL(

input.files[0]

);

preview.style.display="block";

}

</script>

</body>

</html>
