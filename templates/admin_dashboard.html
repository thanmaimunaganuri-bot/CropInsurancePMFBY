<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

<style>

body{

margin:0;

padding:0;

min-height:100vh;

background:

linear-gradient(

135deg,

#0F172A,

#1E293B,

#14532D

);

font-family:Arial, Helvetica, sans-serif;

overflow-x:hidden;

}

.overlay{

min-height:100vh;

padding:40px;

background:rgba(0,0,0,0.15);

}

.heading{

text-align:center;

font-size:52px;

font-weight:700;

color:white;

margin-bottom:45px;

letter-spacing:1px;

text-shadow:

0 0 10px rgba(124,252,0,0.5),

0 0 25px rgba(124,252,0,0.25);

}

.stats{

padding:25px;

border-radius:25px;

background:rgba(15,15,15,0.75);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,0.08);

text-align:center;

margin-bottom:25px;

transition:0.4s;

}

.stats:hover{

transform:translateY(-5px);

box-shadow:

0 0 20px rgba(124,252,0,0.35);

}

.stats h2{

font-size:38px;

color:#7CFC00;

font-weight:bold;

}

.stats p{

color:white;

font-size:18px;

}

.card-box{

padding:35px;

border-radius:30px;

background:rgba(15,15,15,0.75);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,0.08);

text-align:center;

height:250px;

transition:0.4s;

}

.card-box:hover{

transform:translateY(-8px);

box-shadow:

0 0 25px rgba(124,252,0,0.4),

0 0 45px rgba(124,252,0,0.15);

}

.icon{

font-size:55px;

color:#7CFC00;

margin-bottom:20px;

}

.title{

font-size:28px;

color:white;

font-weight:bold;

margin-bottom:20px;

}

.btn-custom{

width:170px;

height:50px;

border:none;

border-radius:30px;

background:#2E7D32;

color:white;

font-size:18px;

font-weight:bold;

transition:0.3s;

}

.btn-custom:hover{

background:#1B5E20;

transform:scale(1.05);

}

.logout{

margin-top:50px;

width:220px;

height:55px;

border:none;

border-radius:40px;

background:#C62828;

color:white;

font-size:20px;

font-weight:bold;

transition:0.3s;

}

.logout:hover{

background:#B71C1C;

transform:scale(1.05);

}

</style>

</head>

<body>

<div class="overlay">

<h1 class="heading">

🌱 Admin Dashboard

</h1>

<div class="container">

<div class="row mb-4">

<div class="col-md-3">

<div class="stats">

<h2>15</h2>

<p>Disease Classes</p>

</div>

</div>

<div class="col-md-3">

<div class="stats">

<h2>16000+</h2>

<p>Training Images</p>

</div>

</div>

<div class="col-md-3">

<div class="stats">

<h2>ResNet50</h2>

<p>AI Model</p>

</div>

</div>

<div class="col-md-3">

<div class="stats">

<h2>{{ total_users }}</h2>

<p>Registered Farmers</p>

</div>

</div>

</div>




<br>

<div class="row g-4">

    <!-- Visualizations -->

    <div class="col-md-4">

        <div class="card-box">

            <div class="icon">
                <i class="fa-solid fa-chart-line"></i>
            </div>

            <div class="title">
                Visualizations
            </div>

            <a href="/visualizations">
                <button class="btn-custom">
                    Open
                </button>
            </a>

        </div>

    </div>

    <!-- Registered Users -->

    <div class="col-md-4">

        <div class="card-box">

            <div class="icon">
                <i class="fa-solid fa-users"></i>
            </div>

            <div class="title">
                Registered Users
            </div>

            <a href="/users">
                <button class="btn-custom">
                    Open
                </button>
            </a>

        </div>

    </div>

    <!-- Prediction History -->

    <div class="col-md-4">

        <div class="card-box">

            <div class="icon">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </div>

            <div class="title">
                Prediction History
            </div>

            <a href="/history">
                <button class="btn-custom">
                    Open
                </button>
            </a>

        </div>

    </div>

</div>

<center>

<a href="/">

<button class="logout">

Logout

</button>

</a>

</center>

</div>

</div>

</body>

</html>
