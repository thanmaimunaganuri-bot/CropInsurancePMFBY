<!DOCTYPE html>

<html>

<head>

<title>

Registered Users

</title>

<link rel="stylesheet"

href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-dark text-white">

<h2 align="center">

Registered Users

</h2>

</div>

<div class="card-body">

<table class="table table-bordered">

<tr>

<th>ID</th>

<th>Name</th>

<th>Username</th>

<th>Email</th>

<th>Phone</th>

</tr>

{% for i in data %}

<tr>

<td>{{i[0]}}</td>

<td>{{i[1]}}</td>

<td>{{i[2]}}</td>

<td>{{i[3]}}</td>

<td>{{i[4]}}</td>

</tr>

{% endfor %}

</table>

<a href="/admin_dashboard">

<button class="btn btn-primary">

Back

</button>

</a>

</div>

</div>

</div>

</body>

</html>
